services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    ports: ["5433:5432"]
    environment:
      POSTGRES_USER: grosir
      POSTGRES_PASSWORD: grosir_dev
      POSTGRES_DB: grosir_dev
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grosir -d grosir_dev"]
      interval: 5s
      timeout: 3s
      retries: 5
volumes:
  pgdata:
