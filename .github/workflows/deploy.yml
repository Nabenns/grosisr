name: Deploy to Production (employ.srvbenss.cloud)

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  typecheck:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.8

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Typecheck
        run: pnpm tsc --noEmit

  deploy:
    name: Deploy to VPS
    needs: typecheck
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST || '103.253.213.178' }}
          username: ${{ secrets.VPS_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e
            cd /root/grosisr-prod
            git fetch origin master
            git reset --hard origin/master
            docker compose -f docker-compose.prod.yml --env-file .env.production build
            docker compose -f docker-compose.prod.yml --env-file .env.production up -d
            echo "Waiting for app container healthy..."
            for i in $(seq 1 40); do
              status=$(docker inspect --format '{{.State.Health.Status}}' grosisr-prod-app-1 2>/dev/null || echo "missing")
              echo "health[$i]: $status"
              if [ "$status" = "healthy" ]; then break; fi
              sleep 3
            done
            docker compose -f docker-compose.prod.yml --env-file .env.production ps
            ok=0
            for i in $(seq 1 20); do
              if curl -fsS -o /dev/null http://127.0.0.1:3002/api/auth/session; then ok=1; break; fi
              echo "probe[$i]: app not reachable yet"
              sleep 3
            done
            if [ "$ok" != "1" ]; then
              echo "App did not become reachable within 60s"
              docker logs --tail 60 grosisr-prod-app-1 || true
              exit 1
            fi
            echo "Deployment successful!"
